trigger:
  branches:
    include:
      - main

pool:
  name: default

stages:
- stage: terraformflow
  jobs:
  - job: terraform_job
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.6.6'

    - script: |
        terraform init
        terraform fmt
        terraform validate
      displayName: Run Terraform Commands